[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glowdl"
version = "1.0.3"
description = "视频下载器 — 跨平台视频下载桌面应用（Windows / macOS），by NamidaTint"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NamidaTint" }]
keywords = ["yt-dlp", "downloader", "video", "pyside6", "bilibili", "youtube", "douyin"]
dependencies = [
    "PySide6-Essentials>=6.7,<6.8",
    "yt-dlp>=2025.1.15",
    "imageio-ffmpeg>=0.4.9",
    "mutagen>=1.47",
    "websocket-client>=1.8",
    "pycryptodomex>=3.20",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.0"]

[project.scripts]
glowdl = "app.main:main"

[project.urls]
Homepage = "https://github.com/yt-dlp/yt-dlp"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
