name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macOS
          - os: windows-latest
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt "pyinstaller>=6.0"
      - name: Icons
        run: python scripts/make_icons.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean scripts/glowdl.spec
          codesign --deep --force --sign - "dist/视频下载器.app" || true
          VERSION=$(python -c "from app import __version__; print(__version__)")
          hdiutil create -volname 视频下载器 -srcfolder "dist/视频下载器.app" -ov -format UDZO "dist/视频下载器-${VERSION}-macOS.dmg"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean scripts/glowdl.spec
          $version = (python -c "from app import __version__; print(__version__)").Trim()
          Compress-Archive -Path "dist\视频下载器\*" -DestinationPath "dist\视频下载器-$version-Windows-x64.zip"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
